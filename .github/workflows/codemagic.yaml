
name: Build TokGo APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build TokGo Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout TokGo
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check project files
        run: |
          echo "=== PROJECT ROOT ==="
          pwd
          echo "=== FILES ==="
          ls -la
          echo "=== GRADLE FILES ==="
          find . -maxdepth 3 -type f \( -name "gradlew" -o -name "settings.gradle*" -o -name "build.gradle*" \) -print

      - name: Make Gradle executable
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          elif [ -f "./android/gradlew" ]; then
            chmod +x ./android/gradlew
          else
            echo "ERROR: Gradle wrapper not found."
            exit 1
          fi

      - name: Build TokGo
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --stacktrace --no-daemon
          elif [ -f "./android/gradlew" ]; then
            cd android
            ./gradlew assembleDebug --stacktrace --no-daemon
          fi

      - name: Find APK
        run: |
          echo "=== APK FILES ==="
          find . -type f -name "*.apk" -print

      - name: Upload TokGo APK
        uses: actions/upload-artifact@v4
        with:
          name: TokGo-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
