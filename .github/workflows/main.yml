
name: Build TokGo APK
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TokGo
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create debug keystore
        run: keytool -genkeypair -v -keystore app/debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build TokGo APK
        run: gradle assembleDebug --stacktrace

      - name: Upload TokGo APK
        uses: actions/upload-artifact@v4
        with:
          name: TokGo-debug-APK
          path: app/build/outputs/apk/debug/*.apk
